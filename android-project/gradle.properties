# 构建提速（2026-11-06）：固定元空间 + ParallelGC，避免冷启动时反复扩堆/GC 抖动。
# Build speed: fixed metaspace + ParallelGC avoids heap growth and GC thrash on cold starts.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# 配置缓存：把配置阶段结果复用，增量构建可再省数秒到十几秒。
# problems=warn 保证 AGP 插件兼容性问题只告警、不阻断构建。
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
# 文件系统监听：Windows 下避免每次构建重新扫描源码树。
org.gradle.vfs.watch=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 的「内置 Kotlin」默认会把 kotlin-stdlib 注入 runtime classpath，即使工程里没有一行 Kotlin。
# 本工程源码 100% Java，这份运行时是纯冗余（实测占 dex 2.06 MB / 1080 个类 / 70% 体积），故关闭。
# Built-in Kotlin in AGP 9 injects kotlin-stdlib even with zero Kotlin sources. This project is
# 100% Java, so that runtime is dead weight (measured 2.06 MB / 1080 classes / ~70% of the dex).
android.builtInKotlin=false
