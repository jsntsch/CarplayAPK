
##########################################
# playback PCM node for audio HAL/PSSE/APP
##########################################
        # from HAL, media source, 48000Hz 2ch
        pcm.pcmMutex_p {
            type pulse
            device combined
        }


        # from HAL, 48000Hz 1ch
        pcm.pcmMixPrompt_p {
            type pulse
            device combined
        }


        # from HAL, 48000Hz 2ch
        pcm.pcmMutexPrompt_p {
            type pulse
            device combined
        }


        # from HAL, 48000Hz 2ch
        pcm.pcmMutexRsi1_p {
            type pulse
            device combined
        }


        # from HAL, 48000Hz 2ch
        pcm.pcmMutexRsi2_p {
            type pulse
            device combined
        }

        # from HAL, 48000Hz 1ch
        pcm.pcmAudibleFB_p {
            type pulse
            device combined
        }


        # from HAL to PA, Carplay(call) downlink raw data, pa loop it to PSSE
        pcm.pcmIntPhnDL_p {
            type pulse
            device carplay_dl
        }


        # from PSSE to PA, processed carplay call uplink 
        pcm.pcmPhn_ul_pro_p {
            type pulse
            rtprio 50
            device carplay_ul
        }


        # from PSSE, processed downlink of BT/carplay/Onstar call
        pcm.pcmDnlnk_pro_p {
            type pulse
            rtprio 50
            device combined
        }



#########################################
# capture PCM node for audio HAL/PSSE/APP
#########################################
    # for PSSE/Native VR, record mic1 mic2 ref_in
    pcm.pcmMicRefIn_c {
        type empty
        slave.pcm pcmHwTDM4RX_c
    }


    # for HAL, record mic1 mic2 ref_in
    pcm.pcmMicRefIn_VR_c {
        type empty
        slave.pcm pcmHwTDM4RX_dupl_c
    }


    # for debug tool only
    pcm.pcm_TunerAux_c {
        type pulse
        device alsa_input.TDM3RX
    }

    # for carplay uplink, from PA to HAL
    pcm.pcmIntPhnUL_c {
        type pulse
        device carplay_ul.monitor
    }


    # for PSSE record raw carplay DL
    pcm.pcmPhn_dl_pre_c {
        type pulse
        rtprio 50
        device carplay_dl.monitor
    }


    # for debug tool, dump TDM3 TX data
    pcm.TDM3TX_dump {
        type pulse
        device alsa_output.TDM3TX.monitor
    }
    
    # for debug tool, dump CSM_AMP data
    pcm.CSM_AMP_dump {
        type pulse
        device alsa_output.avb.csm_amp.monitor
    }
    
    # for debug tool, dump CSM_RSI data
    pcm.CSM_RSI_dump {
        type pulse
        device alsa_output.avb.csm_rsi.monitor
    }    

    # Onstar downlink, 2 channels
    # slot 0 : DOWN LINK
    # slot 1 : PROMPT
    pcm.pcmOnstar_dl_pre_c {
        type pulse
        rtprio 50
        device alsa_input.avb.tcp_csm
    }


#############################
# Hardware device
#############################

# playback from Intel I2S[3] to Dirana3 TDM[0], 8 channels, use as internal amplify speakers
# slot 0 : Mutex sink L
# slot 1 : Mutex sink R
# slot 2 : FEEDBACK sink
# slot 3 : MIX_PROMPT sink
# slot 4-7 : empty
pcm.hw_TDM3TX_playback {
    type hw
    card 0
    device 2
    rate 48000
    format S16_LE
    channels 8
}

# capture from Dirana3 TDM[0] to Intel I2S[3], 8 channles
# slot 0&1 : Tuner
# slot 2&3 : Chime
# slot 4&5 : SXM
# slot 6&7 : AUX
pcm.hw_TDM3RX_capture {
    type hw
    card 0
    device 1
    rate 48000
    format S16_LE
    channels 8
}

# Tuner
pcm.hw_TDM3RX_Tuner_capture {
    type hw
    card 0
    device 11
    rate 48000
    format S16_LE
    channels 2
}

# Chime
pcm.hw_TDM3RX_Chime_capture {
    type hw
    card 0
    device 13
    rate 48000
    format S16_LE
    channels 2
}

# SXM
pcm.hw_TDM3RX_Sxm_capture {
    type hw
    card 0
    device 14
    rate 48000
    format S16_LE
    channels 2
}

# Aux
pcm.hw_TDM3RX_Aux_capture {
    type hw
    card 0
    device 10
    rate 48000
    format S16_LE
    channels 2
}

# Mic_1
pcm.hw_TDM4RX_Mic1_capture {
    type hw
    card 0
    device 15
    rate 48000
    format S16_LE
    channels 1
}
# playback from Intel I2S[4] to Dirana3 TDM[1], 8 channels, need not in GM MY20, prepare for future use
# slot 0-7 empty
pcm.hw_TDM4TX_playback {
    type hw
    card 0
    device 8
    rate 48000
    format S16_LE
    channels 8
}

# capture from Dirana3 TDM[1] to Intel I2S[4], 8 channles
# slot 0   : Mic1
# slot 1   : Mic2
# slot 2&3 : empty
# slot 4   : Ref_in
# slot 5-7 : empty
pcm.hw_TDM4RX_capture {
    type hw
    card 0
    device 7
    rate 48000
    format S16_LE
    channels 8
}

# capture from Dirana3 TDM[1] to Intel I2S[4], 8 channles, duplicate
# slot 0   : Mic1
# slot 1   : Mic2
# slot 2&3 : empty
# slot 4   : Ref_in
# slot 5-7 : empty
pcm.hw_TDM4RX_dupl_capture {
    type hw
    card 0
    device 12
    rate 48000
    format S16_LE
    channels 8
}

# playback from Intel I2S[1] to Bluetooth chip, mono 8000/16000Hz, BT HFP Up Link
pcm.hw_bthfp_playback {
    type hw
    card 0
    device 6
    format S16_LE
    channels 1
}

# capture from Bluetooth chip to Intel I2S[1], mono 8000/16000Hz, BT HFP Down Link
pcm.hw_bthfp_capture {
    type hw
    card 0
    device 5
    format S16_LE
    channels 1
}

#################################################################
# playback to Dirana3 TDM[0] : internal amplify interface
#################################################################
pcm_slave.slave_TDM3TX_playback {
    pcm hw_TDM3TX_playback
}

pcm.pcmHwTDM3TX_p {
    type plug
    slave slave_TDM3TX_playback
}


