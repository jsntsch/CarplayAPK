
##########################################
# playback PCM node for audio HAL/PSSE/APP
##########################################
        # from HAL, media source, 48000Hz 2ch
        pcm._pcmMutex_p {
            type pulse
            device combined
        }

        pcm.pcmMutex_p {
            type syncdump
            id a
            slave {
                pcm _pcmMutex_p
            }
            file %p%t%n_%rHz_%cch_%f_%a.raw
        } 

        # from HAL, 48000Hz 1ch
        pcm._pcmMixPrompt_p {
            type pulse
            device combined
        }

        pcm.pcmMixPrompt_p {
            type syncdump
            id b
            slave {
                pcm _pcmMixPrompt_p
            }
            file %p%t%n_%rHz_%cch_%f_%a.raw
        } 

        # from HAL, 48000Hz 2ch
        pcm._pcmMutexPrompt_p {
            type pulse
            device combined
        }

        pcm.pcmMutexPrompt_p {
            type syncdump
            id c
            slave {
                pcm _pcmMutexPrompt_p
            }
            file %p%t%n_%rHz_%cch_%f_%a.raw
        }

        # from HAL, 48000Hz 2ch
        pcm._pcmMutexRsi1_p {
            type pulse
            device combined
        }

        pcm.pcmMutexRsi1_p {
            type syncdump
            id G
            slave {
                pcm _pcmMutexRsi1_p
            }
            file %p%t%n_%rHz_%cch_%f_%a.raw
        }

        # from HAL, 48000Hz 2ch
        pcm._pcmMutexRsi2_p {
            type pulse
            device combined
        }

        pcm.pcmMutexRsi2_p {
            type syncdump
            id H
            slave {
                pcm _pcmMutexRsi2_p
            }
            file %p%t%n_%rHz_%cch_%f_%a.raw
        }

        # from HAL, 48000Hz 1ch
        pcm._pcmAudibleFB_p {
            type pulse
            device combined
        }

        pcm.pcmAudibleFB_p {
            type syncdump
            id d
            slave {
                pcm _pcmAudibleFB_p
            }
            file %p%t%n_%rHz_%cch_%f_%a.raw
        }

        # from HAL to PA, Carplay(call) downlink raw data, pa loop it to PSSE
        pcm._pcmIntPhnDL_p {
            type pulse
            device carplay_dl
        }

        pcm.pcmIntPhnDL_p {
            type syncdump
            id f
            slave {
                pcm _pcmIntPhnDL_p
            }
            file %p%t%n_%rHz_%cch_%f_%a.raw
        }

        # from PSSE to PA, processed carplay call uplink 
        pcm._pcmPhn_ul_pro_p {
            type pulse
            rtprio 50
            device carplay_ul
        }

        pcm.pcmPhn_ul_pro_p {
            type syncdump
            id g
            slave {
                pcm _pcmPhn_ul_pro_p
            }
            file %p%t%n_%rHz_%cch_%f_%a.raw
        }

        # from PSSE, processed downlink of BT/carplay/Onstar call
        pcm._pcmDnlnk_pro_p {
            type pulse
            rtprio 50
            device combined
        }

        pcm.pcmDnlnk_pro_p {
            type syncdump
            id h
            slave {
                pcm _pcmDnlnk_pro_p
            }
            file %p%t%n_%rHz_%cch_%f_%a.raw
        }


#########################################
# capture PCM node for audio HAL/PSSE/APP
#########################################
    # for PSSE/Native VR, record mic1 mic2 ref_in
    pcm._pcmMicRefIn_c {
        type empty
        slave.pcm pcmHwTDM4RX_c
    }

    pcm.pcmMicRefIn_c {
        type syncdump
        id i
        slave {
            pcm _pcmMicRefIn_c
        }
        file %p%t%n_%rHz_%cch_%f_%a.raw
    }

    # for HAL, record mic1 mic2 ref_in
    pcm._pcmMicRefIn_VR_c {
        type empty
        slave.pcm pcmHwTDM4RX_dupl_c
    }

    pcm.pcmMicRefIn_VR_c {
        type syncdump
        id w
        slave {
            pcm _pcmMicRefIn_VR_c
        }
        file %p%t%n_%rHz_%cch_%f_%a.raw
    }

    # for debug tool only
    pcm.pcm_TunerAux_c {
        type pulse
        device alsa_input.TDM3RX
    }

    # for carplay uplink, from PA to HAL
    pcm._pcmIntPhnUL_c {
        type pulse
        device carplay_ul.monitor
    }

    pcm.pcmIntPhnUL_c {
        type syncdump
        id j
        slave {
            pcm _pcmIntPhnUL_c
        }
        file %p%t%n_%rHz_%cch_%f_%a.raw
    }

    # for PSSE record raw carplay DL
    pcm._pcmPhn_dl_pre_c {
        type pulse
        rtprio 50
        device carplay_dl.monitor
    }

    pcm.pcmPhn_dl_pre_c {
        type syncdump
        id k
        slave {
            pcm _pcmPhn_dl_pre_c
        }
        file %p%t%n_%rHz_%cch_%f_%a.raw
    }

    # for debug tool, dump TDM3 TX data
    pcm.TDM3TX_dump {
        type pulse
        device alsa_output.TDM3TX.monitor
    }
    
    # for debug tool, dump CSM_AMP data
    pcm.CSM_AMP_dump {
        type pulse
        device alsa_output.avb.csm_amp.monitor
    }
    
    # for debug tool, dump CSM_RSI data
    pcm.CSM_RSI_dump {
        type pulse
        device alsa_output.avb.csm_rsi.monitor
    }    

    # Onstar downlink, 2 channels
    # slot 0 : DOWN LINK
    # slot 1 : PROMPT
    pcm._pcmOnstar_dl_pre_c {
        type pulse
        rtprio 50
        device alsa_input.avb.tcp_csm
    }

    pcm.pcmOnstar_dl_pre_c {
        type syncdump
        id l
        slave {
            pcm _pcmOnstar_dl_pre_c
        }
        file %p%t%n_%rHz_%cch_%f_%a.raw
    }

#############################
# Hardware device
#############################

# playback from Intel I2S[3] to Dirana3 TDM[0], 8 channels, use as internal amplify speakers
# slot 0 : Mutex sink L
# slot 1 : Mutex sink R
# slot 2 : FEEDBACK sink
# slot 3 : MIX_PROMPT sink
# slot 4-7 : empty
pcm.hw_TDM3TX_playback {
    type hw
    card 0
    device 2
    rate 48000
    format S16_LE
    channels 8
}

# capture from Dirana3 TDM[0] to Intel I2S[3], 8 channles
# slot 0&1 : Tuner
# slot 2&3 : Chime
# slot 4&5 : SXM
# slot 6&7 : AUX
pcm.hw_TDM3RX_capture {
    type hw
    card 0
    device 1
    rate 48000
    format S16_LE
    channels 8
}

# Tuner
pcm.hw_TDM3RX_Tuner_capture {
    type hw
    card 0
    device 11
    rate 48000
    format S16_LE
    channels 2
}

# Chime
pcm.hw_TDM3RX_Chime_capture {
    type hw
    card 0
    device 13
    rate 48000
    format S16_LE
    channels 2
}

# SXM
pcm.hw_TDM3RX_Sxm_capture {
    type hw
    card 0
    device 14
    rate 48000
    format S16_LE
    channels 2
}

# Aux
pcm.hw_TDM3RX_Aux_capture {
    type hw
    card 0
    device 10
    rate 48000
    format S16_LE
    channels 2
}

# Mic_1
pcm.hw_TDM4RX_Mic1_capture {
    type hw
    card 0
    device 15
    rate 48000
    format S16_LE
    channels 1
}
# playback from Intel I2S[4] to Dirana3 TDM[1], 8 channels, need not in GM MY20, prepare for future use
# slot 0-7 empty
pcm.hw_TDM4TX_playback {
    type hw
    card 0
    device 8
    rate 48000
    format S16_LE
    channels 8
}

# capture from Dirana3 TDM[1] to Intel I2S[4], 8 channles
# slot 0   : Mic1
# slot 1   : Mic2
# slot 2&3 : empty
# slot 4   : Ref_in
# slot 5-7 : empty
pcm.hw_TDM4RX_capture {
    type hw
    card 0
    device 7
    rate 48000
    format S16_LE
    channels 8
}

# capture from Dirana3 TDM[1] to Intel I2S[4], 8 channles, duplicate
# slot 0   : Mic1
# slot 1   : Mic2
# slot 2&3 : empty
# slot 4   : Ref_in
# slot 5-7 : empty
pcm.hw_TDM4RX_dupl_capture {
    type hw
    card 0
    device 12
    rate 48000
    format S16_LE
    channels 8
}

# playback from Intel I2S[1] to Bluetooth chip, mono 8000/16000Hz, BT HFP Up Link
pcm.hw_bthfp_playback {
    type hw
    card 0
    device 6
    format S16_LE
    channels 1
}

# capture from Bluetooth chip to Intel I2S[1], mono 8000/16000Hz, BT HFP Down Link
pcm.hw_bthfp_capture {
    type hw
    card 0
    device 5
    format S16_LE
    channels 1
}

