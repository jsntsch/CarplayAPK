# Global configuration section: lists input and output devices always present on the device
# as well as the output device selected by default.
# Devices are designated by a string that corresponds to the enum in audio.h

global_configuration {
# BEGIN GM, ekwang.lee@lge.com, 09/08/2017, 28868, RSI:MSA, add rsi audio output device
  attached_output_devices AUDIO_DEVICE_OUT_MEDIA_AUDIO|AUDIO_DEVICE_OUT_MIX_PROMPT|AUDIO_DEVICE_OUT_AUD_FEEDBACK|AUDIO_DEVICE_OUT_MUTEX_PROMPT|AUDIO_DEVICE_OUT_WIRED_HEADPHONE|AUDIO_DEVICE_OUT_WIRED_HEADPHONE2|AUDIO_DEVICE_OUT_IP
# END 28868
  default_output_device AUDIO_DEVICE_OUT_MEDIA_AUDIO
  attached_input_devices AUDIO_DEVICE_IN_BUILTIN_MIC
}

# audio hardware module section: contains descriptors for all audio hw modules present on the
# device. Each hw module node is named after the corresponding hw module library base name.
# For instance, "primary" corresponds to audio.primary.<device>.so.
# The "primary" module is mandatory and must include at least one output with
# AUDIO_OUTPUT_FLAG_PRIMARY flag.
# Each module descriptor contains one or more output profile descriptors and zero or more
# input profile descriptors. Each profile lists all the parameters supported by a given output
# or input stream category.
# The "channel_masks", "formats", "devices" and "flags" are specified using strings corresponding
# to enums in audio.h and audio_policy.h. They are concatenated by use of "|" without space or "\n".

audio_hw_modules {
  primary {
    global_configuration {
      audio_hal_version 3.0
    }
    outputs {
      primary1 {
        sampling_rates 48000
        channel_masks AUDIO_CHANNEL_OUT_STEREO
        formats AUDIO_FORMAT_PCM_16_BIT
        devices AUDIO_DEVICE_OUT_MEDIA_AUDIO
        flags AUDIO_OUTPUT_FLAG_PRIMARY
      }
      primary2 {
        sampling_rates 48000
        channel_masks AUDIO_CHANNEL_OUT_STEREO
        formats AUDIO_FORMAT_PCM_16_BIT
        devices AUDIO_DEVICE_OUT_MIX_PROMPT
        flags AUDIO_OUTPUT_FLAG_PRIMARY
      }
      primary3 {
        sampling_rates 48000
        channel_masks AUDIO_CHANNEL_OUT_STEREO
        formats AUDIO_FORMAT_PCM_16_BIT
        devices AUDIO_DEVICE_OUT_AUD_FEEDBACK
        flags AUDIO_OUTPUT_FLAG_PRIMARY
      }
      primary4 {
        sampling_rates 48000
        channel_masks AUDIO_CHANNEL_OUT_STEREO
        formats AUDIO_FORMAT_PCM_16_BIT
        devices AUDIO_DEVICE_OUT_MUTEX_PROMPT
        flags AUDIO_OUTPUT_FLAG_PRIMARY
      }
      primary5 {
        sampling_rates 48000
        channel_masks AUDIO_CHANNEL_OUT_STEREO
        formats AUDIO_FORMAT_PCM_16_BIT
        devices AUDIO_DEVICE_OUT_WIRED_HEADPHONE
        flags AUDIO_OUTPUT_FLAG_PRIMARY | AUDIO_OUTPUT_FLAG_RSI_1
      }
      primary6 {
        sampling_rates 48000
        channel_masks AUDIO_CHANNEL_OUT_STEREO
        formats AUDIO_FORMAT_PCM_16_BIT
        devices AUDIO_DEVICE_OUT_WIRED_HEADPHONE2
        flags AUDIO_OUTPUT_FLAG_PRIMARY | AUDIO_OUTPUT_FLAG_RSI_2
      }
      carplay {
        sampling_rates 8000|16000|24000
        channel_masks AUDIO_CHANNEL_OUT_MONO
        formats AUDIO_FORMAT_PCM_16_BIT
        devices AUDIO_DEVICE_OUT_PHONE_DOWNLINK
        flags AUDIO_OUTPUT_FLAG_DIRECT
      }
    }
    inputs {
      primary {
        sampling_rates 8000|11025|12000|16000|22050|24000|32000|44100|48000
        channel_masks AUDIO_CHANNEL_IN_MONO|AUDIO_CHANNEL_IN_STEREO|AUDIO_CHANNEL_INDEX_MASK_1|AUDIO_CHANNEL_INDEX_MASK_2|AUDIO_CHANNEL_INDEX_MASK_3|AUDIO_CHANNEL_INDEX_MASK_4|AUDIO_CHANNEL_INDEX_MASK_5|AUDIO_CHANNEL_INDEX_MASK_6|AUDIO_CHANNEL_INDEX_MASK_7|AUDIO_CHANNEL_INDEX_MASK_8
        formats AUDIO_FORMAT_PCM_16_BIT
        devices AUDIO_DEVICE_IN_BUILTIN_MIC
      }
    }
  }
}
